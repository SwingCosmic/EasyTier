# Feature-branch CI: slim Core builds + slim checks/tests.
# Full matrix / cargo-hack / three_node suite stay on main via core.yml + test.yml.
name: Feature CI

on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      # Always run on feature branches (path filter still avoids pure-doc noise).
      should_skip: ${{ steps.skip_check.outputs.should_skip == 'true' && !startsWith(github.ref_name, 'feature/') }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'
          cancel_others: 'true'
          paths: >-
            ["Cargo.toml", "Cargo.lock", "easytier/**", "easytier-web/**",
             "easytier-contrib/easytier-magisk/**",
             ".github/workflows/ci-feature.yml", ".github/actions/**"]

  # --- slim checks (no cargo-hack / each-feature) ---
  check:
    name: Check (slim)
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt,clippy
          rustflags: ''

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Check Clippy (easytier only)
        if: ${{ !cancelled() }}
        run: cargo clippy --package easytier --all-targets --features full -- -D warnings

      - name: Check Cargo.lock is up to date
        if: ${{ !cancelled() }}
        run: |
          if ! cargo metadata --format-version 1 --locked > /dev/null; then
            echo "::error::Cargo.lock is out of date. Run cargo generate-lockfile or cargo build locally, then commit Cargo.lock."
            exit 1
          fi

  # --- slim tests: unit/integration only (skip three_node + subnet_proxy) ---
  pre-test:
    name: Build test archive
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "feature-ci"

      - uses: taiki-e/install-action@nextest

      - name: Archive tests
        run: cargo nextest archive --archive-file tests.tar.zst --package easytier --features full

      - uses: actions/upload-artifact@v5
        with:
          name: feature-tests
          path: tests.tar.zst
          retention-days: 1

  test:
    name: Test (slim)
    runs-on: ubuntu-latest
    needs: [ pre_job, pre-test ]
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup tools for test
        run: sudo apt-get update && sudo apt-get install -y bridge-utils

      - name: Setup system for test
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl net.bridge.bridge-nf-call-iptables=0 || true
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0 || true
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0 || true
          sudo ip addr add 2001:db8::2/64 dev lo 2>/dev/null || true

      - uses: taiki-e/install-action@nextest

      - name: Download tests
        uses: actions/download-artifact@v4
        with:
          name: feature-tests

      - name: Run tests (exclude three_node)
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          # Drop the slow multi-node integration suite on feature branches.
          sudo -E env "PATH=$PATH" cargo nextest run \
            --archive-file tests.tar.zst \
            -E 'not test(tests::three_node)' \
            --test-threads 1 \
            --no-fail-fast

  # --- slim release builds: linux x64/arm64, windows x64 + Magisk ---
  build_web:
    runs-on: ubuntu-latest
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Frontend Environment
        uses: ./.github/actions/prepare-pnpm
        with:
          build-filter: './easytier-web/*'

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-web-dashboard
          path: |
            easytier-web/frontend/dist/*
          retention-days: 7

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-24.04-arm
            ARTIFACT_NAME: linux-aarch64
          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64

    runs-on: ${{ matrix.OS }}
    env:
      NAME: easytier
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
    needs:
      - pre_job
      - build_web
    if: needs.pre_job.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: easytier-web-dashboard
          path: easytier-web/frontend/dist/

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "feature-ci-core"
          cache-targets: "false"

      - name: Build
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
            FEATURES="mimalloc"
          elif [[ "$TARGET" == aarch64* ]]; then
            SUFFIX=""
            FEATURES="mimalloc"
          else
            SUFFIX=""
            FEATURES="jemalloc"
          fi

          cargo build --release --target "$TARGET" --package=easytier-web --features=embed
          mv "./target/$TARGET/release/easytier-web${SUFFIX}" "./target/$TARGET/release/easytier-web-embed${SUFFIX}"

          cargo build --release --target "$TARGET" --features="$FEATURES"

      - name: Collect artifacts
        run: |
          mkdir -p ./artifacts/objects/

          if [[ $OS =~ ^windows.*$ ]]; then
            SUFFIX=.exe
            find "easytier/third_party/x86_64" -maxdepth 1 -type f \( -name "*.dll" -o -name "*.sys" \) -exec cp {} ./artifacts/objects/ \;
          else
            SUFFIX=""
            # optional UPX on linux (best-effort)
            if [[ $OS =~ ^ubuntu.*$ ]]; then
              HOST_ARCH=$(uname -m)
              case $HOST_ARCH in
                x86_64)  UPX_ARCH="amd64" ;;
                aarch64) UPX_ARCH="arm64" ;;
                *)       UPX_ARCH="amd64" ;;
              esac
              UPX_VERSION=4.2.4
              UPX_PKG="upx-${UPX_VERSION}-${UPX_ARCH}_linux"
              curl -L "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_PKG}.tar.xz" -s | tar xJvf - || true
              if [[ -f "${UPX_PKG}/upx" ]]; then
                cp "${UPX_PKG}/upx" .
                UPX_BIN=./upx
              fi
            fi
          fi

          for BIN in ./target/$TARGET/release/easytier-{core,cli,web,web-embed}"$SUFFIX"; do
            if [[ -f "$BIN" ]]; then
              if [[ -n "${UPX_BIN:-}" ]]; then
                $UPX_BIN --lzma --best "$BIN" || true
              fi
              mv "$BIN" ./artifacts/objects/
            fi
          done

          mv ./artifacts/objects/* ./artifacts/
          rm -rf ./artifacts/objects/

      - name: Archive artifact
        uses: actions/upload-artifact@v5
        with:
          name: easytier-${{ matrix.ARTIFACT_NAME }}
          path: |
            ./artifacts/*
          retention-days: 7

  build_magisk:
    name: Magisk (Android pre-build)
    runs-on: ubuntu-latest
    needs: [ pre_job, build ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux aarch64 binaries
        uses: actions/download-artifact@v4
        with:
          name: easytier-linux-aarch64
          path: ./downloaded-binaries/

      - name: Prepare binaries
        run: |
          mkdir -p ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-core ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-cli ./easytier-contrib/easytier-magisk/
          cp ./downloaded-binaries/easytier-web ./easytier-contrib/easytier-magisk/

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v5
        with:
          name: Easytier-Magisk
          path: |
            ./easytier-contrib/easytier-magisk
            !./easytier-contrib/easytier-magisk/build.sh
            !./easytier-contrib/easytier-magisk/magisk_update.json
          if-no-files-found: error
          retention-days: 7

  result:
    runs-on: ubuntu-latest
    needs: [ pre_job, check, test, build_web, build, build_magisk ]
    if: needs.pre_job.result == 'success' && needs.pre_job.outputs.should_skip != 'true' && !cancelled()
    steps:
      - name: Mark result as failed
        if: contains(needs.*.result, 'failure')
        run: exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "### Feature CI"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: [open](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "**Builds:** linux-x86_64, linux-aarch64, windows-x86_64, Easytier-Magisk (7-day artifacts)"
            echo "**Tests:** fmt + clippy(easytier) + nextest excluding three_node (no cargo-hack)"
          } >> "$GITHUB_STEP_SUMMARY"
